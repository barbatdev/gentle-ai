# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Go 1.25.12, Bubbletea TUI (charmbracelet/bubbletea v1.3.10), lipgloss v1.1.0
  Architecture: cmd/ entrypoints and internal/ packages (agents, tui, model, pipeline, catalog, system, planner, verify, update, opencode, installcmd, cli, app, components, state, backup, assets, agentbuilder)
  Workspace: root Go module plus an independent bench/ Go module for black-box journey measurement; root Go commands do not include bench/.
  Agents: multi-agent support (claude, opencode, cursor, codex, gemini, vscode, windsurf, antigravity)
  Skills catalog: internal/catalog/skills.go — known skill registry; project skills in skills/
  Build: goreleaser (.goreleaser.yaml), CI: GitHub Actions (ci.yml, pr-check.yml, release.yml)
  Style: gofmt (standard), go vet, no golangci-lint config found

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected internal/ packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex TUI flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Load gentleman-bubbletea skill for TUI work (internal/tui/)
    - Load gentleman-installer skill for installation steps
    - Load gentleman-system skill for OS/system detection
    - Load go-testing skill when writing tests
    - Follow existing code patterns in internal/ packages
  verify:
    - Run root module tests: go test ./... (from the workspace root)
    - Run benchmark module tests: go test ./... (from bench/)
    - Run relevant module static analysis: go vet ./... (from the applicable module root)
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: false
  detected: "2026-08-24"
  workspace_test_command: null
  strict_tdd_reason: "No explicit workspace-level test command covers both independent Go modules."

  projects:
    - path: "."
      stack: "Go 1.25.12; Bubbletea 1.3.10; Lipgloss 1.1.0"
      test_command: "go test ./..."
      test_working_directory: "."
      framework: "Go standard testing"
    - path: "bench/"
      stack: "Go 1.25.12"
      test_command: "go test ./..."
      test_working_directory: "bench/"
      framework: "Go standard testing"

  layers:
    unit:
      available: true
      tool: "go test"
      note: "Available in both independent Go modules; invoke each module from its own root."
    integration:
      available: true
      tool: "net/http/httptest (built-in)"
    e2e:
      available: true
      tool: "Docker-based E2E (e2e/docker-test.sh)"
      note: "Dockerfile.ubuntu, Dockerfile.fedora, Dockerfile.arch — triggered by RUN_FULL_E2E=1"
    tui:
      available: true
      tool: "bubbletea tea.KeyMsg simulation (no teatest — direct model.Update() testing)"
      note: "TUI tests use direct Bubbletea model updates, not teatest library"

  coverage:
    available: true
    command: "go test -cover ./... (from each applicable module root)"

  quality:
    linter:
      available: false
      note: "No golangci-lint config found; go vet is available"
    type_checker:
      available: true
      command: "go vet ./... (from each applicable module root)"
    formatter:
      available: true
      command: "gofmt"
